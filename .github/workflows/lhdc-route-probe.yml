name: LHDC route probe package

on:
  workflow_dispatch:
  push:
    paths:
      - "System/LHDC/**"
      - ".github/workflows/lhdc-route-probe.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        run: node --check System/LHDC/x17_qti_software_session_route_v01.js

      - name: Package probe
        run: |
          mkdir -p dist
          cp System/LHDC/x17_qti_software_session_route_v01.js dist/
          cp System/LHDC/README_RU.md dist/
          sha256sum dist/*
          zip -j dist/X17_LHDC_QTI_SOFTWARE_SESSION_ROUTE_v02.zip dist/*

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: X17_LHDC_QTI_SOFTWARE_SESSION_ROUTE_v02
          path: dist/X17_LHDC_QTI_SOFTWARE_SESSION_ROUTE_v02.zip
